---
# Installer les paquets nécessaires à Docker
- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-venv
    state: latest
    update_cache: yes

# Créer le dossier qui contiendra la clé GPG de Docker
- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Télécharger la clé GPG officielle de Docker
- name: Add Docker GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Ajouter le dépôt APT de Docker (version de Debian lue dans les facts)
- name: Add Docker APT repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
    state: present
    update_cache: yes

# Installer Docker
- name: Install Docker
  apt:
    name: docker-ce
    state: present

# Installer Python3 et pip3
- name: Install Python3 and pip3
  apt:
    name:
      - python3
      - python3-pip
    state: present

# Créer un environnement virtuel Python pour le SDK Docker
- name: Create a virtual environment for Docker SDK
  command: python3 -m venv /opt/docker_venv
  args:
    creates: /opt/docker_venv

# Installer le SDK Docker pour Python dans le venv
- name: Install Docker SDK for Python in virtual environment
  command: /opt/docker_venv/bin/pip install docker

# Vérifier que Docker est démarré
- name: Make sure Docker is running
  service:
    name: docker
    state: started
  tags: docker
