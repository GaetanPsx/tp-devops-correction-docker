---
# Lancer Apache (reverse proxy) : seul conteneur avec un port publié
- name: Run HTTPD
  community.docker.docker_container:
    name: httpd
    image: gaetanpsxx/tp-devops-httpd:latest
    pull: true
    restart_policy: unless-stopped
    networks:
      - name: app-network
    ports:
      - "80:80"
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
