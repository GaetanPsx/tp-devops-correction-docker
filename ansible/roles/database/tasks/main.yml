---
# Lancer la base PostgreSQL depuis l'image publiée sur Docker Hub
- name: Run database
  community.docker.docker_container:
    name: database
    image: gaetanpsxx/tp-devops-database:latest
    pull: true
    restart_policy: unless-stopped
    networks:
      - name: app-network
    env:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
    volumes:
      - db-volume:/var/lib/postgresql/data
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
