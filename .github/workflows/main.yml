name: CI devops 2025
on:
  # Lance le pipeline sur les branches main et develop
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  # Compile, teste et analyse le backend
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Installe Java 21 (distribution Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Compile et lance les tests (unitaires + intégration avec Testcontainers)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

            # Analyse de la qualité du code avec SonarCloud (Quality Gate)
      - name: SonarCloud analysis
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=GaetanPsx_tp-devops-correction-docker -Dsonar.organization=gaetanpsx -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} --file ./simple-api/pom.xml

  # Construit et publie les images Docker
  build-and-push-docker-image:
    # Ne se lance que si les tests et l'analyse du backend sont passés
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      # Récupère le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # Connexion à Docker Hub avec les secrets GitHub (jamais en clair)
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build de l'image du backend, push uniquement sur main
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Build de l'image de la base, push uniquement sur main
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Build de l'image du serveur HTTP, push uniquement sur main
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}


                # Build de l'image du front, push uniquement sur main
      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest
          push: ${{ github.ref == 'refs/heads/main' }}

    # Déploie l'application sur le serveur avec Ansible
  deploy:
    # Ne se lance que si les images ont été construites et publiées
    needs: build-and-push-docker-image
    # Déploiement uniquement depuis la branche main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      # Récupère le code (dont le dossier ansible)
      - name: Checkout code
        uses: actions/checkout@v4

      # Installe Ansible et la collection Docker à jour
      - name: Install Ansible
        run: |
          pipx install --include-deps ansible
          ansible-galaxy collection install community.docker --upgrade

      # Écrit la clé SSH du serveur depuis le secret GitHub
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/takima_key
          chmod 400 ~/.ssh/takima_key

      # Lance le playbook : récupère les nouvelles images et relance les conteneurs
      - name: Run Ansible playbook
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i inventories/setup.yml playbook.yml -e ansible_ssh_private_key_file=~/.ssh/takima_key        